        document.getElementById('cust_phone').value = data.phone || '';
        document.getElementById('cust_address').value = data.addr || '';
        document.getElementById('final_note').value = data.note || '';
        document.getElementById('app_date').value = data.appDate || '';
        document.getElementById('app_time').value = data.appTime || '09:00';
        document.getElementById('app_loc').value = data.appLoc || 'Bakalarska 2/B214';
        appAsked = data.appAsked || false;
        document.getElementById('appointment-sec').style.display = data.appVisible || 'none';
        translations[curLang].qs.forEach((item, i) => {
            if(data.answers && data.answers[i] !== undefined) {
                const val = item.a[data.answers[i]];
                const rb = document.querySelector(`input[name="q${i}"][value="${val}"]`);
                if(rb) { rb.checked = true; rb.parentElement.classList.add('selected'); }
            }
            if(data.manuals && data.manuals[i]) document.getElementById(`q${i}_man`).value = data.manuals[i];
        });
        if(data.extras) data.extras.forEach(val => {
            const cb = document.querySelector(`input[name="extra"][value="${val}"]`);
            if(cb) { cb.checked = true; cb.parentElement.classList.add('selected'); }
        });
    }
    function cycleLang() {
        saveCache();
        let idx = langOrder.indexOf(curLang);
        idx = (idx + 1) % langOrder.length;
        curLang = langOrder[idx];
        localStorage.setItem('alo_lang', curLang);
        setLang(curLang);
    }
    function setLang(l) {
        const cur = translations[l];
        document.getElementById('menu-alo').innerText = cur.menu[0];
        document.getElementById('menu-oferta').innerText = cur.menu[1];
        document.getElementById('menu-uslugi').innerText = cur.menu[2];
        document.getElementById('menu-kontakt').innerText = cur.menu[3];
        document.getElementById('menu-lang').innerText = cur.menu[4];
        document.getElementById('lang-badge-txt').innerText = l;
        document.getElementById('txt-brand-2').innerText = cur.desc;
        document.getElementById('txt-brand-sub').innerText = cur.brand;
        document.getElementById('txt-brand-3').innerText = cur.note;
        document.getElementById('txt-sec-1').innerText = cur.sec1;
        document.getElementById('txt-sec-2').innerText = cur.sec2;
        document.getElementById('txt-sec-3').innerText = cur.sec3;
        document.getElementById('txt-sec-4').innerText = cur.sec4;
        document.getElementById('txt-hint-send').innerText = cur.hint;
        document.getElementById('cust_name').placeholder = cur.name;
        document.getElementById('cust_phone').placeholder = cur.phone + " *";
        document.getElementById('cust_address').placeholder = cur.addr;
        document.getElementById('txt-app-title').innerText = cur.appTitle;
        document.getElementById('btn-reset-txt').innerText = cur.resetBtn;
        const c = document.getElementById('questions-container');
        c.innerHTML = '';
        cur.qs.forEach((item, i) => {
            const row = document.createElement('div'); row.className = 'question-block';
            row.innerHTML = `<span class="question-text">${item.q}</span><div class="options-row">${item.a.map(opt => `<label class="opt-label"><input type="radio" name="q${i}" value="${opt}" onclick="handleRadioClick(this)"> ${opt}</label>`).join('')}</div><input type="text" class="manual-input" id="q${i}_man" placeholder="${cur.other}" oninput="saveCache()">`;
            c.appendChild(row);
        });
        const ex = document.getElementById('extra-container');
        ex.innerHTML = cur.extras.map(e => `<label class="opt-label"><input type="checkbox" name="extra" value="${e.v}" onchange="handleExtraClick(this)"> ${e.l}</label>`).join('');
        loadCache();
    }
    function handleRadioClick(el) {
        document.querySelectorAll(`input[name="${el.name}"]`).forEach(r => r.parentElement.classList.remove('selected'));
        el.parentElement.classList.add('selected');
        saveCache();
    }
    function handleExtraClick(el) {
        el.parentElement.classList.toggle('selected', el.checked);
        if (el.checked && !appAsked) { openModal(translations[curLang].appMsg, 'askApp'); appAsked = true; }
        saveCache();
    }
    function validateDate(input) {
        if(!input.value) return;
        const day = new Date(input.value).getDay();
        if (day === 0 || day === 6) { alert(translations[curLang].errWeekend); input.value = ""; }
    }
    function clearOnlyAnswers() {
        document.querySelectorAll('#questions-container input[type="radio"]').forEach(r => { r.checked = false; r.parentElement.classList.remove('selected'); });
        document.querySelectorAll('.manual-input').forEach(i => i.value = '');
        document.querySelectorAll('input[name="extra"]').forEach(c => { c.checked = false; c.parentElement.classList.remove('selected'); });
        document.getElementById('appointment-sec').style.display = 'none';
        document.getElementById('app_date').value = '';
        document.getElementById('final_note').value = '';
        appAsked = false;
        saveCache();
    }

    function openModal(msg, mode = 'alert', type = '') {
        const textEl = document.getElementById('modal-text'); 
        const btnGroup = document.getElementById('modal-btns');
        const cur = translations[curLang];
        textEl.innerText = msg;

        if (mode === 'askApp') {
            btnGroup.innerHTML = `<button class="m-btn btn-confirm" style="background:#0088cc; color:white;" onclick="showAppSec()">${cur.yes}</button><button class="m-btn btn-close" onclick="closeModal()">${cur.no}</button>`;
        } 
        else if (mode === 'success') {
            btnGroup.innerHTML = `<button class="m-btn btn-success" onclick="closeModal()">${cur.mOk}</button>`;
        }
        else if (mode === 'loading') {
            btnGroup.innerHTML = `<div style="padding:10px; color:#0088cc;"><i class="fa-solid fa-spinner fa-spin"></i> Processing...</div>`;
        }
        else {
            btnGroup.innerHTML = `<button class="m-btn btn-close" onclick="closeModal()">${cur.mOk}</button>`;
        }
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function showAppSec() { document.getElementById('appointment-sec').style.display = 'block'; saveCache(); closeModal(); }

    function buildContent() {
        if(document.getElementById('hp_field').value !== "") {
            console.log("Spam detected via honeypot.");
            return null;
        }

        const name = document.getElementById('cust_name').value.trim(); 
        const phone = document.getElementById('cust_phone').value.trim(); 
        const addr = document.getElementById('cust_address').value.trim();
        const cur = translations[curLang];
        const lb = cur.msgLabels;

        if (!name || !phone || !addr) { openModal(cur.err); return null; }
        
        let text = `${lb.title}\n${lb.name}: ${name}\n${lb.tel}: ${phone}\n${lb.addr}: ${addr}\n\n`; 
        let answered = 0;
        
        cur.qs.forEach((item, i) => {
            const sel = document.querySelector(`input[name="q${i}"]:checked`); 
            const man = document.getElementById(`q${i}_man`).value.trim();
            if(sel || man) { text += `${item.q} ${sel?sel.value:''} ${man?'('+man+')':''}\n`; answered++; }
        });
        if (answered < 5) { openModal(cur.errQs); return null; }
        
        const extras = Array.from(document.querySelectorAll('input[name="extra"]:checked')).map(el => el.value);
        if(extras.length > 0) text += `\n${lb.extra}: ${extras.join(', ')}\n`;
        
        const appDate = document.getElementById('app_date').value;
        if(document.getElementById('appointment-sec').style.display === 'block' && appDate) {
            text += `\n${lb.app}: ${appDate} (${document.getElementById('app_time').value})\n${lb.loc}: ${document.getElementById('app_loc').value}\n`;
        }
        const note = document.getElementById('final_note').value.trim(); 
        if(note) text += `\n${lb.note}: ${note}`;
        return { name, text };
    }

    function askConfirm(type) { 
        const lastSend = localStorage.getItem('last_send_time');
        const now = Date.now();
        if (lastSend && (now - lastSend < 30000)) {
            const remaining = Math.ceil((30000 - (now - lastSend)) / 1000);
            alert(translations[curLang].waitMsg.replace('{s}', remaining));
            return;
        }

        const content = buildContent();
        if(content) { 
            localStorage.setItem('last_send_time', now);
            executeSend(type, content); 
        }
    }
    
    async function executeSend(t, d) {
        if(!d) return; 
        
        const cur = translations[curLang]; 
        const text = d.text;
        const enc = encodeURIComponent(text);
        
        try { 
            await navigator.clipboard.writeText(text); 
        } catch (e) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }
    
        switch(t) {
            case 'tg': 
                closeModal();
                openModal(cur.sending, 'loading');
                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_MY_ID, text: text })
                }).then(res => {
                    if(res.ok) {
                        openModal(cur.sentSuccess, 'success');
                    } else {
                        openModal(cur.tgError);
                        setTimeout(() => window.open(`https://t.me/aka242`, '_blank'), 1500);
                    }
                }).catch(() => {
                    window.open(`https://t.me/aka242`, '_blank');
                });
                break;
            
            case 'viber': 
                window.open(`viber://chat?number=%2B${TARGET_PHONE}`, '_self');
                openModal(cur.viberCopy, 'success');
                break;
    
            case 'wa': 
                window.open(`https://api.whatsapp.com/send?phone=${TARGET_PHONE}&text=${enc}`, '_blank'); 
                break;
    
            case 'mail': 
                const subject = `${cur.msgLabels.mailSub} - ${d.name}`;
                const encSub = encodeURIComponent(subject);
                window.location.href = `mailto:${TARGET_EMAIL}?subject=${encSub}&body=${enc}`; 
                break;
    
            case 'sms': 
                window.location.href = (navigator.userAgent.match(/iPhone|iPad|iPod/i)) ? `sms:+${TARGET_PHONE}&body=${enc}` : `sms:+${TARGET_PHONE}?body=${enc}`; 
                break;
        }
    }

    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    const dateInput = document.getElementById('app_date');
    if(dateInput) dateInput.min = tomorrow.toISOString().split('T')[0];

    setLang(curLang);
</script>
