<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regulamin | ALO SERWIS</title>
  <meta name="description" content="Regulamin świadczenia usług serwisowych ALO SERWIS.">
  <style>
    :root{
      --orange:#f58220;
      --orange-dark:#d96b0b;
      --text:#1f1f1f;
      --muted:#6b6b6b;
      --line:#ececec;
      --bg:#ffffff;
      --soft:#fff8f1;
      --max:1120px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      line-height:1.65;
    }
    a{color:inherit;text-decoration:none}
    .topbar{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(8px);
    }
    .nav{
      max-width:var(--max);
      margin:auto;
      min-height:72px;
      padding:0 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }
    .brand{
      font-size:24px;
      font-weight:800;
      letter-spacing:.3px;
      color:var(--orange);
      white-space:nowrap;
    }
    .menu{
      display:flex;
      align-items:center;
      gap:27px;
      font-size:14px;
      font-weight:700;
      letter-spacing:.45px;
    }
    .menu a:hover,.menu a.active{color:var(--orange)}
    .lang{
      border:1px solid #ddd;
      border-radius:8px;
      padding:8px 10px;
      font-weight:700;
      background:#fff;
      color:var(--text);
    }
    .burger{display:none;border:0;background:transparent;font-size:27px;cursor:pointer}
    .hero{
      max-width:var(--max);
      margin:0 auto;
      padding:66px 22px 35px;
    }
    .eyebrow{
      color:var(--orange);
      font-size:13px;
      font-weight:800;
      letter-spacing:1.6px;
      text-transform:uppercase;
      margin-bottom:10px;
    }
    h1{
      margin:0;
      color:var(--orange);
      font-size:clamp(34px,5vw,58px);
      line-height:1.05;
      letter-spacing:-1.5px;
    }
    .lead{
      max-width:800px;
      margin-top:20px;
      color:#4b4b4b;
      font-size:17px;
    }
    .notice{
      max-width:var(--max);
      margin:0 auto 28px;
      padding:0 22px;
    }
    .notice-inner{
      background:var(--soft);
      border-left:4px solid var(--orange);
      padding:17px 19px;
      border-radius:8px;
      color:#3f3f3f;
    }
    main{
      max-width:var(--max);
      margin:auto;
      padding:0 22px 70px;
    }
    .toc{
      border:1px solid var(--line);
      border-radius:14px;
      padding:22px 24px;
      margin:0 0 34px;
      background:#fff;
    }
    .toc-title{
      color:var(--orange);
      font-weight:800;
      margin-bottom:10px;
    }
    .toc-links{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:7px 24px;
    }
    .toc a{color:#444}
    .toc a:hover{color:var(--orange)}
    section.rule{
      padding:27px 0;
      border-bottom:1px solid var(--line);
      scroll-margin-top:95px;
    }
    section.rule h2{
      margin:0 0 12px;
      color:var(--orange);
      font-size:23px;
    }
    section.rule p{margin:8px 0}
    section.rule ol, section.rule ul{
      margin:10px 0 0;
      padding-left:23px;
    }
    section.rule li{margin:8px 0}
    strong{font-weight:750}
    .contact-box{
      margin-top:34px;
      padding:23px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
    }
    .contact-box h2{color:var(--orange);margin:0 0 8px}
    footer{
      border-top:1px solid var(--line);
      background:#fff;
    }
    .footer-inner{
      max-width:var(--max);
      margin:auto;
      padding:34px 22px;
      display:grid;
      grid-template-columns:1.2fr 1fr 1fr;
      gap:30px;
      color:#444;
      font-size:14px;
    }
    .footer-title{
      color:var(--orange);
      font-weight:800;
      margin-bottom:9px;
    }
    .footer-links{
      display:flex;
      flex-direction:column;
      gap:7px;
    }
    .footer-links a:hover{color:var(--orange)}
    .copyright{
      max-width:var(--max);
      margin:auto;
      padding:17px 22px 25px;
      border-top:1px solid var(--line);
      color:#777;
      font-size:13px;
    }
    @media (max-width:780px){
      .nav{min-height:64px}
      .burger{display:block}
      .menu{
        display:none;
        position:absolute;
        top:64px;left:0;right:0;
        background:#fff;
        border-bottom:1px solid var(--line);
        padding:18px 22px 23px;
        flex-direction:column;
        align-items:flex-start;
        gap:17px;
      }
      .menu.open{display:flex}
      .lang{position:absolute;right:67px}
      .hero{padding-top:44px}
      .toc-links{grid-template-columns:1fr}
      .footer-inner{grid-template-columns:1fr}
      section.rule h2{font-size:21px}
    }
  </style>
</head>

function render(lang){
  const d=page[lang]||page.pl;
  document.documentElement.lang=lang;
  document.title = d.title + " | ALO SERWIS";
  const toc = d.s.map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join("");
  const sections = d.s.map(x=>`
    <section class="rule" id="${x[0]}">
      <h2>${x[1]}</h2>
      <ol>${x[2].map(v=>`<li>${v}</li>`).join("")}</ol>
    </section>`).join("");
  document.getElementById("content").innerHTML = `
    <div class="hero">
      <div class="eyebrow">${d.eyebrow}</div>
      <h1>${d.title}</h1>
      <div class="lead">${d.lead}</div>
    </div>
    <div class="notice"><div class="notice-inner">${d.notice}</div></div>
    <main>
      <div class="toc">
        <div class="toc-title">${d.toc}</div>
        <div class="toc-links">${toc}</div>
      </div>
      ${sections}
      <div class="contact-box">
        <h2>${d.contactTitle}</h2>
        <div>${d.contactText}</div>
      </div>
    </main>`;
  const f=footer[lang]||footer.pl;
  document.querySelectorAll("[data-ft]").forEach(el=>el.textContent=f[el.dataset.ft]);
  localStorage.setItem("alo-lang",lang);
}
const selector=document.getElementById("lang");
const initial=localStorage.getItem("alo-lang")||"pl";
selector.value=page[initial]?initial:"pl";
render(selector.value);
selector.addEventListener("change",e=>render(e.target.value));
document.getElementById("burger").addEventListener("click",()=>{
  document.getElementById("menu").classList.toggle("open");
});
document.querySelectorAll("#menu a").forEach(a=>a.addEventListener("click",()=>{
  document.getElementById("menu").classList.remove("open");
}));
</script>
