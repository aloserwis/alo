<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALO SERWIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-orange: #f58220;
            --travel-blue: #00e5ff;
            --dark-bg: #000000;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- ANIMATIONS --- */
        @keyframes zoomGift { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); } }
        @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes lightSlide { 0% { left: -100%; } 100% { left: 100%; } }
        @keyframes shimmer { to { background-position: 200% center; } }
        @keyframes shakePulse { 0%, 100% { transform: scale(1) rotate(0deg); } 20% { transform: scale(1.05) rotate(-2deg); } 40% { transform: scale(1.05) rotate(2deg); } }

        .shimmer-text { 
            background: linear-gradient(to right, #f58220 0%, #fff 50%, #f58220 100%); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: shimmer 3s linear infinite; 
        }
        .gift-icon { display: inline-block; animation: zoomGift 1.2s ease-in-out infinite; }
        .lay-ngay-badge { 
            background: var(--primary-orange); color: black; font-weight: 900; 
            border-radius: 12px; box-shadow: 0 0 35px var(--primary-orange); 
            animation: shakePulse 1.2s infinite ease-in-out; 
        }
        .line-effect { width: 100%; height: 4px; background: #111; position: relative; overflow: hidden; margin: 15px 0; }
        .line-effect::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--primary-orange), #fff, var(--primary-orange), transparent); animation: lightSlide 2.5s linear infinite; }

        .banner-container { position: relative; flex-shrink: 0; overflow: hidden; }
        .inner-content { position: absolute; inset: 2px; background: var(--dark-bg); overflow: hidden; }
        .banner-container::before { content: ''; position: absolute; inset: -150px; background: conic-gradient(from 0deg, transparent 65%, var(--primary-orange) 85%, #fff 100%); animation: rotateGlow 4s linear infinite; z-index: 1; }
        .banner-container::after { content: ''; position: absolute; inset: 6px; background: var(--dark-bg); z-index: 2; }

        .visual-group { position: relative; display: flex; justify-content: center; align-items: center; z-index: 5; }
        .glow-spinner { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 50%, var(--primary-orange) 95%, #fff 100%); animation: rotateGlow 2s linear infinite; -webkit-mask: radial-gradient(circle, transparent 68%, black 70%); filter: blur(10px) drop-shadow(0 0 40px var(--primary-orange)); }
        .phone-img { transform: rotate(-5deg); filter: drop-shadow(0 0 70px rgba(245, 130, 32, 0.6)); position: relative; z-index: 6; }

        /* VERSION DỌC (MOBILE) */
        @media (max-aspect-ratio: 1/1) {
            #banner-h { display: none; }
            .banner-container { width: 1080px; height: 1920px; }
            .layout-v { position: absolute; inset: 0; z-index: 10; padding: 20px 0; display: flex; flex-direction: column; align-items: center; }
            .header-v { color: var(--primary-orange); font-size: 115px; font-weight: 900; margin-bottom: 15px; }
            .title-v { color: white; font-size: 78px; font-weight: 900; text-transform: uppercase; text-align: center; transform: translateY(-20px); }
            .line-v { width: 90%; transform: translateY(-20px); }
            .shimmer-v { font-size: 85px; font-weight: 900; text-align: center; }
            .row-v { display: flex; align-items: center; gap: 25px; margin-top: 10px; }
            .lay-ngay-v { font-size: 60px; padding: 10px 30px; }
            .visual-v { width: 880px; height: 880px; margin: 40px 0; }
            .phone-v { width: 82%; }
            .promo-v { background: white; padding: 20px 60px; border-radius: 100px; font-size: 52px; font-weight: 900; margin-top: 20px; transform: translateY(-20px); }
            .commit-v { margin-top: 10px; display: flex; flex-direction: column; gap: 45px; text-align: center; } 
            .sub-v { color: white; font-size: 38px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

            /* Navigation */
            .nav-v { position: absolute; bottom: 40px; left: 40px; display: flex; flex-direction: column; gap: 25px; z-index: 100; align-items: flex-start; }
            .nav-item { 
                text-decoration: none; 
                width: 130px; height: 130px; 
                background: rgba(255, 255, 255, 0.1); 
                backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
                border: 3px solid rgba(245, 130, 32, 0.5); 
                border-radius: 65px; 
                display: flex; justify-content: center; align-items: center; 
                transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                overflow: hidden;
                white-space: nowrap;
            }

            .nav-item.active { 
                width: fit-content; 
                padding: 0 40px; 
                background: rgba(245, 130, 32, 0.2);
                border-color: var(--primary-orange);
            }

            .nav-item i { font-size: 60px; color: var(--primary-orange); min-width: 70px; text-align: center; }
            
            .nav-label { 
                color: white; font-size: 36px; font-weight: 900; 
                margin-left: 0; opacity: 0; max-width: 0;
                transition: all 0.3s ease;
                text-transform: uppercase;
            }
            .nav-item.active .nav-label { 
                opacity: 1; max-width: 600px; margin-left: 20px;
            }

            /* Style riêng cho Khách sạn/Parking */
            .travel-icon { border-color: var(--travel-blue); }
            .travel-icon i { color: var(--travel-blue); }
            .nav-item.travel-icon.active { background: rgba(0, 229, 255, 0.2); border-color: var(--travel-blue); }
        }

        /* VERSION NGANG (Ẩn trong demo này) */
        @media (min-aspect-ratio: 1/1) { #banner-v { display: none; } .banner-container { width: 1920px; height: 1080px; } }
    </style>
</head>
<body>

    <div class="banner-container" id="rescaleWrapper">
        <div class="inner-content">
            
            <div id="banner-v" class="layout-v">
                <div class="header-v">ALO SERWIS</div>
                <div class="title-v">SỬA CHỮA ĐIỆN THOẠI</div>
                <div class="line-effect line-v"></div>
                <div class="shimmer-v shimmer-text">THAY MÀN HÌNH</div>
                <div class="row-v">
                    <div class="shimmer-v shimmer-text">IPHONE</div>
                    <span class="lay-ngay-badge lay-ngay-v">LẤY NGAY!</span>
                </div>
                <div class="visual-group visual-v">
                    <div class="glow-spinner"></div>
                    <img src="https://i.postimg.cc/G2NvS0Q6/iphone-orange.png" class="phone-img phone-v">
                </div>
                <div class="promo-v">
                    <span class="gift-icon">🎁</span> TẶNG KÍNH CƯỜNG LỰC
                </div>
                <div class="commit-v">
                    <div class="sub-v">★ CHẤT LƯỢNG TỐT NHẤT ★</div>
                    <div class="sub-v">★ THỜI GIAN NHANH CHÓNG ★</div>
                    <div class="sub-v">★ BẢO HÀNH LINH KIỆN 1 ĐỔI 1 ★</div>
                </div>

                <div class="nav-v">
                    <a href="https://www.google.com/maps/dir/?api=1&destination=TatryTop+Jurgów+SKI+Jurgów+353" target="_blank" class="nav-item dt-link travel-icon">
                        <i class="fa-solid fa-hotel"></i>
                        <span class="nav-label">Khách sạn</span>
                    </a>
                    
                    <a href="https://www.google.com/maps/dir/?api=1&destination=Parking+Środkowa+181+Białka+Tatrzańska" target="_blank" class="nav-item dt-link travel-icon">
                        <i class="fa-solid fa-square-parking"></i>
                        <span class="nav-label">Parking</span>
                    </a>

                    <a href="https://m.me/dienthoaibalan" target="_blank" class="nav-item dt-link">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                        <span class="nav-label">Báo giá</span>
                    </a>
                    <a href="tel:733676869" class="nav-item dt-link">
                        <i class="fa-solid fa-phone"></i>
                        <span class="nav-label">733 676 869</span>
                    </a>
                    <a href="https://m.me/dienthoaibalan" target="_blank" class="nav-item dt-link">
                        <i class="fa-brands fa-facebook-messenger"></i>
                        <span class="nav-label">Messenger</span>
                    </a>
                    <a href="https://www.google.com/maps/dir/?api=1&destination=Bakalarska+2+Warszawa" target="_blank" class="nav-item dt-link">
                        <i class="fa-solid fa-location-dot"></i>
                        <span class="nav-label">Google map</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const links = document.querySelectorAll('.dt-link');
        links.forEach(link => {
            link.addEventListener('click', function(e) {
                if (!this.classList.contains('active')) {
                    e.preventDefault(); 
                    links.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                }
            });
        });

        document.addEventListener('touchstart', function(e) {
            if (!e.target.closest('.dt-link')) {
                links.forEach(l => l.classList.remove('active'));
            }
        });

        function rescale() {
            const wrapper = document.getElementById('rescaleWrapper');
            const isPortrait = window.innerHeight > window.innerWidth;
            const designW = isPortrait ? 1080 : 1920;
            const designH = isPortrait ? 1920 : 1080;
            const scale = Math.min(window.innerWidth / designW, window.innerHeight / designH);
            wrapper.style.width = designW + 'px';
            wrapper.style.height = designH + 'px';
            wrapper.style.transform = `scale(${scale})`;
            wrapper.style.transformOrigin = 'center center';
        }
        window.addEventListener('resize', rescale);
        window.addEventListener('load', rescale);
        rescale();
    </script>
</body>
</html>
