<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alo Serwis - Mobile Final Pro</title>
    <style>
        :root {
            --primary-orange: #f58220;
            --dark-bg: #000000;
        }

        body {
            background-color: #1a1a1a;
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- MOBILE STYLE (1080x1920) --- */
        .banner-mobile {
            width: 100vw;
            max-width: 500px;
            aspect-ratio: 1080 / 1920;
            background-color: var(--dark-bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            border: 3px solid rgba(245, 130, 32, 0.5);
            box-shadow: inset 0 0 30px rgba(245, 130, 32, 0.3);
        }

        /* Hiệu ứng tia sáng chạy quanh viền banner */
        .banner-mobile::after {
            content: ""; position: absolute; inset: 0; border: 3px solid transparent;
            background: linear-gradient(90deg, transparent, var(--primary-orange), transparent) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out; mask-composite: exclude;
            background-size: 200% 100%; animation: borderFlow 3s linear infinite; z-index: 10;
        }

        .mobile-inner { 
            position: absolute; inset: 0; background: var(--dark-bg); z-index: 1; 
            display: flex; flex-direction: column; padding: 20px 10px 0;
        }

        .mobile-header { 
            z-index: 5; text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; width: 100%;
        }

        .brand-name { color: var(--primary-orange); font-weight: 900; font-size: 34px; text-transform: uppercase; margin-bottom: 5px; }
        .title-repair { font-size: 32px; text-transform: uppercase; font-weight: 800; margin: 0; }
        .highlight-iphone { 
            font-size: 28px; font-weight: 900; color: #fff; text-transform: uppercase;
            margin-top: 10px; margin-bottom: 25px; white-space: nowrap;
            animation: neonGlow 2s ease-in-out infinite alternate;
        }

        .lay-ngay-overlay {
            position: absolute; right: 15px; top: 112px; font-size: 38px; font-weight: 950;
            color: var(--primary-orange); text-transform: uppercase; z-index: 10;
            animation: pulseShakeRight 0.8s infinite ease-in-out;
            text-shadow: 2px 2px 5px #000, 0 0 25px var(--primary-orange);
            white-space: nowrap;
        }

        /* --- EFFECT HỘP QUÀ --- */
        .mobile-promo-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        
        .mobile-promo-tag { 
            background: white; color: black; padding: 6px 22px; border-radius: 40px; 
            font-size: 19px; font-weight: 900; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        .gift-icon {
            display: inline-block;
            font-size: 24px;
            animation: giftJump 1s infinite cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 5px var(--primary-orange));
        }

        .quality-badge { font-weight: bold; font-size: 13px; letter-spacing: 4px; color: white; text-transform: uppercase; }

        /* Visual Section (Tăng 20%) */
        .mobile-visual { 
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center; 
            z-index: 2; min-height: 0; transform: scale(1.2); 
        }

        .mobile-spinner { 
            position: absolute; width: 90%; aspect-ratio: 1/1; border-radius: 50%; 
            background: conic-gradient(from 0deg, transparent 40%, var(--primary-orange) 85%, #fff 100%); 
            animation: rotateOuter 3s linear infinite; -webkit-mask: radial-gradient(circle, transparent 65%, black 67%); 
            filter: blur(3px); box-shadow: 0 0 30px rgba(245, 130, 32, 0.4);
        }

        .mobile-phone { 
            height: 75%; width: auto; max-width: 95%; z-index: 3; 
            transform: rotate(-5deg); filter: drop-shadow(0 0 40px rgba(245,130,32,0.6)); 
        }

        /* Footer */
        .mobile-info { 
            z-index: 15; background: rgba(5, 5, 5, 0.98); padding: 12px 15px; border-top: 3px solid var(--primary-orange); 
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-shrink: 0;
        }
        .mobile-info-item { font-size: 11px; color: #ccc; }
        .mobile-info-item b { display: block; color: var(--primary-orange); font-size: 12px; margin-bottom: 2px; font-weight: 900; }

        /* KEYFRAMES */
        @keyframes giftJump {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.3) translateY(-5px); }
        }
        @keyframes borderFlow { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes neonGlow {
            from { text-shadow: 0 0 5px #fff, 0 0 15px var(--primary-orange); }
            to { text-shadow: 0 0 2px #fff, 0 0 8px var(--primary-orange); }
        }
        @keyframes pulseShakeRight {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-3deg); }
            50% { transform: scale(1.1) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        @keyframes rotateOuter { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="banner-mobile">
        <div class="mobile-inner">
            <div class="mobile-header">
                <div class="brand-name">ALO SERWIS</div>
                <p class="title-repair">SỬA CHỮA ĐIỆN THOẠI</p>
                <div class="highlight-iphone">THAY MÀN HÌNH IPHONE</div>
                <div class="lay-ngay-overlay">LẤY NGAY</div>
                
                <div class="mobile-promo-group">
                    <div class="mobile-promo-tag">
                        <span class="gift-icon">🎁</span> TẶNG KÍNH CƯỜNG LỰC
                    </div>
                    <div class="quality-badge">CHẤT LƯỢNG TỐT NHẤT</div>
                </div>
            </div>

            <div class="mobile-visual">
                <div class="mobile-spinner"></div>
                <img src="https://i.postimg.cc/G2NvS0Q6/iphone-orange.png" alt="Sửa chữa điện thoại" class="mobile-phone">
            </div>

            <div class="mobile-info">
                <div class="mobile-info-item"><b>Hotline 24/7</b>787 456 999</div>
                <div class="mobile-info-item"><b>Website</b>aloserwis.com</div>
                <div class="mobile-info-item"><b>Cơ sở 1</b>Nadrzeczna 7C (ASG)</div>
                <div class="mobile-info-item"><b>Cơ sở 2</b>Bakalarska 2 (B214)</div>
            </div>
        </div>
    </div>

</body>
</html>
