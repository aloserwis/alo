    function saveCache() {
        const formData = {
            name: document.getElementById('cust_name').value,
            phone: document.getElementById('cust_phone').value,
            addr: document.getElementById('cust_address').value,
            note: document.getElementById('final_note').value,
            appDate: document.getElementById('app_date').value,
            appTime: document.getElementById('app_time').value,
            appLoc: document.getElementById('app_loc').value,
            appVisible: document.getElementById('appointment-sec').style.display,
            answers: {}, manuals: {}, extras: []
        };
        translations[curLang].qs.forEach((item, i) => {
            const sel = document.querySelector(`input[name="q${i}"]:checked`);
            if(sel) formData.answers[i] = item.a.indexOf(sel.value);
            formData.manuals[i] = document.getElementById(`q${i}_man`).value;
        });
        document.querySelectorAll('input[name="extra"]:checked').forEach(el => formData.extras.push(el.value));
        localStorage.setItem('alo_cache', JSON.stringify(formData));
    }
    function loadCache() {
        const data = JSON.parse(localStorage.getItem('alo_cache'));
        if(!data) return;
        document.getElementById('cust_name').value = data.name || '';
        document.getElementById('cust_phone').value = data.phone || '';
        document.getElementById('cust_address').value = data.addr || '';
        document.getElementById('final_note').value = data.note || '';
        document.getElementById('app_date').value = data.appDate || '';
        document.getElementById('app_time').value = data.appTime || '09:00';
        document.getElementById('app_loc').value = data.appLoc || 'Bakalarska 2/B214';
        document.getElementById('appointment-sec').style.display = data.appVisible || 'none';
        translations[curLang].qs.forEach((item, i) => {
            if(data.answers && data.answers[i] !== undefined) {
                const val = item.a[data.answers[i]];
                const rb = document.querySelector(`input[name="q${i}"][value="${val}"]`);
                if(rb) { rb.checked = true; rb.dataset.wasChecked = 'true'; rb.parentElement.classList.add('selected'); }
            }
            if(data.manuals && data.manuals[i]) document.getElementById(`q${i}_man`).value = data.manuals[i];
        });
        if(data.extras) data.extras.forEach(val => {
            const cb = document.querySelector(`input[name="extra"][value="${val}"]`);
            if(cb) { cb.checked = true; cb.parentElement.classList.add('selected'); }
        });
    }

    function setPhotoStatus(message, isError = false) {
        const status = document.getElementById('photo-status');
        status.textContent = message;
        status.classList.toggle('error', isError);
    }
    function invalidatePhotoUpload() {
        photoRevision++;
        uploadedPhotoRevision = -1;
        uploadedPhotoLanguage = '';
        uploadedPhotoLink = '';
        photoUploadPromise = null;
    }
    function renderProjectPhotos(message = '', isError = false) {
        const grid = document.getElementById('photo-preview-grid');
        grid.innerHTML = '';
        projectPhotos.forEach((photo, index) => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            const image = document.createElement('img');
            image.src = photo.previewUrl;
            image.alt = `${translations[curLang].msgLabels.photos} ${index + 1}`;
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'photo-remove';
            remove.setAttribute('aria-label', translations[curLang].clearPhotos);
            remove.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            remove.addEventListener('click', () => removeProjectPhoto(index));
            const number = document.createElement('span');
            number.className = 'photo-number';
            number.textContent = String(index + 1);
            card.append(image, remove, number);
            grid.appendChild(card);
        });
        if(message) {
            setPhotoStatus(message, isError);
        } else {
            const cur = translations[curLang];
            setPhotoStatus(projectPhotos.length ? cur.photoCount.replace('{n}', projectPhotos.length) : cur.photoNone);
        }
    }
    function loadPhotoImage(file) {
        return new Promise((resolve, reject) => {
            const sourceUrl = URL.createObjectURL(file);
            const image = new Image();
            image.onload = () => {
                URL.revokeObjectURL(sourceUrl);
                resolve(image);
            };
            image.onerror = () => {
                URL.revokeObjectURL(sourceUrl);
                reject(new Error('image_decode_failed'));
            };
            image.src = sourceUrl;
        });
    }
    async function compressProjectPhoto(file, index) {
        const image = await loadPhotoImage(file);
        const largestSide = Math.max(image.naturalWidth, image.naturalHeight);
        const scale = Math.min(1, MAX_PHOTO_DIMENSION / largestSide);
        const width = Math.max(1, Math.round(image.naturalWidth * scale));
        const height = Math.max(1, Math.round(image.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d', { alpha: false });
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);
        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(result => result ? resolve(result) : reject(new Error('image_encode_failed')), 'image/jpeg', 0.82);
        });
        const baseName = (file.name || `photo-${index + 1}`).replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9_-]+/g, '-').slice(0, 45) || `photo-${index + 1}`;
        return new File([blob], `${baseName}.jpg`, { type: 'image/jpeg', lastModified: Date.now() });
    }
    async function handlePhotoFiles(input) {
        const selectedFiles = Array.from(input.files || []);
        input.value = '';
        if(!selectedFiles.length) return;
        const cur = translations[curLang];
        let remaining = MAX_PROJECT_PHOTOS - projectPhotos.length;
        if(remaining <= 0) {
            renderProjectPhotos(cur.photoMax, true);
            return;
        }
        const box = document.getElementById('photo-upload-box');
        box.classList.add('processing');
        setPhotoStatus(cur.photoProcessing);
        let warning = selectedFiles.length > remaining ? cur.photoMax : '';
        let addedPhotos = false;
        for(const file of selectedFiles.slice(0, remaining)) {
            if(!file.type.startsWith('image/')) {
                warning = cur.photoInvalid;
                continue;
            }
            if(file.size > MAX_PHOTO_BYTES) {
                warning = cur.photoTooLarge;
                continue;
            }
            try {
                const compressedFile = await compressProjectPhoto(file, projectPhotos.length);
                projectPhotos.push({ file: compressedFile, previewUrl: URL.createObjectURL(compressedFile) });
                addedPhotos = true;
                remaining--;
            } catch(error) {
                warning = cur.photoInvalid;
            }
        }
        box.classList.remove('processing');
        if(addedPhotos) invalidatePhotoUpload();
        renderProjectPhotos(warning, Boolean(warning));
    }
    function removeProjectPhoto(index) {
        const removed = projectPhotos.splice(index, 1)[0];
        if(removed) URL.revokeObjectURL(removed.previewUrl);
        if(removed) invalidatePhotoUpload();
        renderProjectPhotos();
    }
    function clearProjectPhotos() {
        projectPhotos.forEach(photo => URL.revokeObjectURL(photo.previewUrl));
        projectPhotos = [];
        invalidatePhotoUpload();
        document.getElementById('project-photo-camera').value = '';
        document.getElementById('project-photo-gallery').value = '';
        renderProjectPhotos();
    }
    function handleRadioClick(el) {
        const removeCurrentChoice = el.dataset.wasChecked === 'true';
        document.querySelectorAll(`input[name="${el.name}"]`).forEach(r => {
            r.checked = false;
            r.dataset.wasChecked = 'false';
            r.parentElement.classList.remove('selected');
        });
        if (!removeCurrentChoice) {
            el.checked = true;
            el.dataset.wasChecked = 'true';
            el.parentElement.classList.add('selected');
        }
        saveCache();
    }
    function handleExtraClick(el) {
        el.parentElement.classList.toggle('selected', el.checked);
        saveCache();
    }
    function validateDate(input) {

        button.classList.toggle('is-open', isVisible);
    }

    function toggleAppointment() {
        const section = document.getElementById('appointment-sec');
        const isVisible = section.style.display === 'block';
        if (isVisible) {
            section.style.display = 'none';
            document.getElementById('app_date').value = '';
            document.getElementById('app_time').value = '09:00';
            document.getElementById('app_loc').value = 'Bakalarska 2/B214';
        } else {
            section.style.display = 'block';
        }
        updateAppointmentToggle();
        saveCache();
    }

    function openModal(msg, mode = 'alert', type = '') {
        const textEl = document.getElementById('modal-text'); 
        const btnGroup = document.getElementById('modal-btns');
        const cur = translations[curLang];
        textEl.innerText = msg;

        if (mode === 'success') {
            btnGroup.innerHTML = `<button class="m-btn btn-success" onclick="closeModal()">${cur.mOk}</button>`;
        }
        else if (mode === 'loading') {
            btnGroup.innerHTML = `<div style="padding:10px; color:#0088cc;"><i class="fa-solid fa-spinner fa-spin"></i> Processing...</div>`;
        }
        else {
            btnGroup.innerHTML = `<button class="m-btn btn-close" onclick="closeModal()">${cur.mOk}</button>`;
        }
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    function buildContent() {
        if(document.getElementById('hp_field').value !== "") {
            console.log("Spam detected via honeypot.");
            return null;
        }

        const name = document.getElementById('cust_name').value.trim(); 
        const phone = document.getElementById('cust_phone').value.trim(); 
        const addr = document.getElementById('cust_address').value.trim();
        const cur = translations[curLang];
        const lb = cur.msgLabels;

        if (!name || !phone || !addr) { openModal(cur.err); return null; }
        
        let text = `${lb.title}\n${lb.name}: ${name}\n${lb.tel}: ${phone}\n${lb.addr}: ${addr}\n\n`; 
        let answered = 0;
        
        cur.qs.forEach((item, i) => {
            const sel = document.querySelector(`input[name="q${i}"]:checked`); 
            const man = document.getElementById(`q${i}_man`).value.trim();
            if(sel || man) { text += `${item.q} ${sel?sel.value:''} ${man?'('+man+')':''}\n`; answered++; }
        });
        if (answered < 5) { openModal(cur.errQs); return null; }
        
        const extras = Array.from(document.querySelectorAll('input[name="extra"]:checked')).map(el => el.value);
        if(extras.length > 0) text += `\n${lb.extra}: ${extras.join(', ')}\n`;
        
        const appDate = document.getElementById('app_date').value;
        if(document.getElementById('appointment-sec').style.display === 'block' && appDate) {
            text += `\n${lb.app}: ${appDate} (${document.getElementById('app_time').value})\n${lb.loc}: ${document.getElementById('app_loc').value}\n`;
        }
        if(projectPhotos.length) text += `\n${lb.photos}: ${projectPhotos.length}\n`;
        const note = document.getElementById('final_note').value.trim(); 
        if(note) text += `\n${lb.note}: ${note}`;
        return { name, phone, text };
    }

    function askConfirm(type) { 
        const lastSend = localStorage.getItem('last_send_time');
        const now = Date.now();
        if (lastSend && (now - lastSend < 30000)) {
            const remaining = Math.ceil((30000 - (now - lastSend)) / 1000);
            alert(translations[curLang].waitMsg.replace('{s}', remaining));
            return;
        }

        const content = buildContent();
        if(content) { 
            localStorage.setItem('last_send_time', now);
            executeSend(type, content); 
        }
    }
    
    async function copyQuoteText(text) {
        try {
            await navigator.clipboard.writeText(text);
        } catch (error) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            textArea.remove();
        }
    }
    async function getProjectPhotoLink() {
        if(!projectPhotos.length) return '';
        if(uploadedPhotoLink && uploadedPhotoRevision === photoRevision && uploadedPhotoLanguage === curLang) return uploadedPhotoLink;
        if(photoUploadPromise) return photoUploadPromise;
        const revisionAtStart = photoRevision;
        const languageAtStart = curLang;
        photoUploadPromise = (async () => {
            const formData = new FormData();
            formData.append('language', languageAtStart);
            projectPhotos.forEach((photo, index) => formData.append('photos', photo.file, `photo-${index + 1}.jpg`));
            const response = await fetch(`${API_BASE}/api/upload-images`, {
                method: 'POST',
                headers: { 'X-Requested-With': 'ALO-Oferta' },
                body: formData
            });
            if(!response.ok) throw new Error(`Photo upload ${response.status}`);
            const result = await response.json();
            if(!result.url || !/^https:\/\//i.test(result.url)) throw new Error('Invalid gallery URL');
            if(photoRevision !== revisionAtStart) throw new Error('Photos changed during upload');
            if(curLang !== languageAtStart) throw new Error('Language changed during upload');
            uploadedPhotoLink = result.url;
            uploadedPhotoRevision = revisionAtStart;
            uploadedPhotoLanguage = languageAtStart;
            return uploadedPhotoLink;
        })();
        try {
            return await photoUploadPromise;
        } finally {
            photoUploadPromise = null;
        }
    }
    async function executeSend(t, d) {
        if(!d) return;

        const cur = translations[curLang];
        let text = d.text;
        const phoneOfGuest = d.phone;
        const fullSuccessMsg = cur.sentSuccess + "\n\n" + phoneOfGuest + "\n\n";
        if(projectPhotos.length) {
            openModal(cur.photoUploading, 'loading');
            try {
                const galleryLink = await getProjectPhotoLink();
                text += `\n${cur.msgLabels.photos}: ${galleryLink}`;
                closeModal();
            } catch(error) {
                localStorage.removeItem('last_send_time');
                openModal(cur.photoUploadError);
                return;
            }
        }

        const enc = encodeURIComponent(text);
        copyQuoteText(text);
        switch(t) {
            case 'tg':
                closeModal();
                openModal(cur.sending, 'loading');
                try {
                    const response = await fetch(`${API_BASE}/api/send-telegram`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'ALO-Oferta'
                        },
                        body: JSON.stringify({ text })
                    });
                    if(!response.ok) throw new Error(`Telegram message ${response.status}`);
                    openModal(fullSuccessMsg, 'success');
                } catch(error) {
                    openModal(cur.tgError);
                    setTimeout(() => window.open('https://t.me/aka242', '_blank'), 1500);
                }
                break;

            case 'viber':
                window.open(`viber://chat?number=%2B${TARGET_PHONE}`, '_self');
                openModal(cur.viberCopy, 'success');
                break;

            case 'wa':
                if(projectPhotos.length) window.location.href = `https://api.whatsapp.com/send?phone=${TARGET_PHONE}&text=${enc}`;
                else window.open(`https://api.whatsapp.com/send?phone=${TARGET_PHONE}&text=${enc}`, '_blank');
                break;

            case 'mail': {
                const subject = `${cur.msgLabels.mailSub} - ${d.name}`;
                window.location.href = `mailto:${TARGET_EMAIL}?subject=${encodeURIComponent(subject)}&body=${enc}`;
                break;
            }

            case 'sms':
                window.location.href = navigator.userAgent.match(/iPhone|iPad|iPod/i) ? `sms:+${TARGET_PHONE}&body=${enc}` : `sms:+${TARGET_PHONE}?body=${enc}`;
                break;
        }
    }

    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    const dateInput = document.getElementById('app_date');
    if(dateInput) dateInput.min = tomorrow.toISOString().split('T')[0];

    setLang(curLang);
</script>
