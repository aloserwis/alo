<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALOSERWIS - Báo giá</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f4f7f9; --wa: #25d366; --viber: #7360f2; --zalo: #0068ff; --sms: #34495e; }
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); margin: 0; padding: 10px; color: var(--primary); }
        .container { max-width: 500px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        /* Modal Styles */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        #modal-box { background: white; width: 100%; max-width: 320px; border-radius: 15px; text-align: center; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: pop 0.3s ease; }
        #modal-text { font-size: 1rem; font-weight: bold; margin-bottom: 25px; color: #d35400; line-height: 1.5; }
        .modal-btn-group { display: flex; flex-direction: column; gap: 10px; }
        .m-btn { border: none; padding: 12px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-confirm { background: var(--primary); color: white; }
        .btn-retry { background: var(--accent); color: white; }
        .btn-close { background: #ecf0f1; color: #7f8c8d; }

        /* Header Brand */
        .header-brand { text-align: center; margin-bottom: 15px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .brand-1 { font-size: 1.6rem; font-weight: 900; color: var(--accent); margin: 0; letter-spacing: 1px; }
        .brand-2 { font-size: 0.8rem; font-weight: 600; margin: 4px 0; color: #444; }
        .brand-sub { font-size: 0.8rem; color: var(--primary); font-weight: bold; font-style: italic; margin-top: 5px; }
        .brand-3 { font-size: 0.7rem; color: #666; font-style: italic; margin-top: 5px; line-height: 1.3; }

        /* Languages */
        .lang-selector { display: flex; gap: 4px; margin-bottom: 10px; }
        .lang-item { flex: 1; border: 1px solid #ddd; padding: 8px 2px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 0.75rem; background: #fff; font-weight: bold; }
        .lang-item input { display: none; }
        .lang-item:has(input:checked) { background: var(--primary); color: #fff; }
        #sub-lang-container { display: none; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; padding: 8px; background: #fff8f0; border-radius: 8px; border: 1px dashed var(--accent); }

        /* Form */
        .section-title { background: #fdf2e9; padding: 6px 10px; font-weight: bold; margin: 12px 0 8px; border-left: 4px solid var(--accent); font-size: 0.75rem; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 4px; outline: none; font-size: 14px; }
        .question-block { margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #eee; }
        .question-text { font-weight: bold; font-size: 0.8rem; display: block; margin-bottom: 5px; }
        .options-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .opt-label { border: 1px solid #eee; padding: 8px 2px; border-radius: 6px; text-align: center; font-size: 0.65rem; cursor: pointer; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 45px; font-weight: 600; }
        .opt-label input { display: none; }
        .opt-label.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .manual-input { background: #fafafa; border: 1px dashed #ccc !important; font-size: 0.7rem !important; margin-top: 4px; height: 28px; }

        /* Appointment Section */
        #appointment-sec { display: none; background: #f0f7ff; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #d0e3f0; }
        .appoint-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }

        .hint-send { text-align: center; font-size: 0.75rem; font-weight: bold; color: var(--accent); margin-top: 20px; }
        
        /* CẬP NHẬT: Tỉ lệ giãn cách tăng cực mạnh (x5) */
        .social-row { 
            display: flex; 
            justify-content: space-evenly; /* Phân bổ đều khoảng trống dư thừa */
            gap: 20vw; /* Tăng tỉ lệ gap lên 20% chiều ngang */
            margin-top: 10px; 
            padding: 20px 0; 
            border-bottom: 1px solid #eee; 
            flex-wrap: nowrap;
            overflow: hidden; /* Tránh tràn ngang nếu màn hình quá nhỏ */
        }
        .social-circle { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
            border: none; 
            cursor: pointer; 
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .social-circle:active { transform: scale(0.9); }
        .social-circle img { width: 60%; height: 60%; }

        /* Giới hạn trên màn hình lớn để giữ thẩm mỹ */
        @media (min-width: 500px) {
            .social-row { gap: 60px; }
        }

        /* Footer */
        .footer-info { margin-top: 20px; font-size: 0.62rem; color: #333; line-height: 1.2; border-top: 1px solid #eee; padding: 15px 20px 0 20px; }
        .footer-grid { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; }
        .f-location { display: flex; align-items: center; gap: 6px; flex: 0 1 auto; }
        .f-location:nth-child(2) { text-align: right; justify-content: flex-end; }
        .f-label { font-weight: 900; color: var(--accent); font-size: 0.52rem; writing-mode: vertical-lr; transform: rotate(180deg); border-right: 1.5px solid var(--accent); padding-right: 4px; height: 38px; display: flex; align-items: center; flex-shrink: 0; white-space: nowrap; }
        .f-detail { font-weight: 600; }
        .f-detail b { color: var(--accent); font-size: 0.65rem; }
        .f-contact { width: 100%; text-align: center; margin-top: 15px; padding: 10px; background: #fafafa; border-radius: 6px; font-size: 0.65rem; }
        .f-contact span { display: inline-block; margin: 0 5px; }
        .f-contact b { color: var(--accent); }
        .footer-bottom { text-align: center; margin-top: 12px; font-weight: bold; font-size: 0.55rem; color: #ccc; }

        @media (min-width: 600px) {
            .container { max-width: 750px; }
            .footer-info { padding: 20px 40px 0 40px; }
            .footer-grid { flex-wrap: nowrap; gap: 10px; }
            .f-location { flex: 1; }
            .f-location:nth-child(2) { text-align: left; justify-content: center; }
            .f-contact { flex: 1; width: auto; text-align: right; margin-top: 0; background: none; border-left: 1px solid #eee; padding: 0 0 0 15px; display: flex; flex-direction: column; justify-content: center; border-radius: 0; }
            .f-contact span { display: block; margin: 0; }
        }
    </style>
</head>
<body>

<div id="modal-overlay">
    <div id="modal-box"><div id="modal-text"></div><div class="modal-btn-group" id="modal-btns"></div></div>
</div>

<div class="container">
    <div class="lang-selector">
        <label class="lang-item"><input type="radio" name="L" value="PL" checked onchange="toggleExtra(false); setLang('PL')"> 🇵🇱 PL</label>
        <label class="lang-item"><input type="radio" name="L" value="EN" onchange="toggleExtra(false); setLang('EN')"> 🇺🇸 EN</label>
        <label class="lang-item"><input type="radio" name="L" value="VN" onchange="toggleExtra(false); setLang('VN')"> 🇻🇳 VN</label>
        <label class="lang-item"><input type="radio" name="L" value="#" onchange="toggleExtra(true)"> 🌐</label>
    </div>

    <div id="sub-lang-container">
        <label class="lang-item"><input type="radio" name="L" value="TR" onchange="setLang('TR')"> 🇹🇷 TR</label>
        <label class="lang-item"><input type="radio" name="L" value="CN" onchange="setLang('CN')"> 🇨🇳 CN</label>
        <label class="lang-item"><input type="radio" name="L" value="UK" onchange="setLang('UK')"> 🇺🇦 UK</label>
        <label class="lang-item"><input type="radio" name="L" value="DE" onchange="setLang('DE')"> 🇩🇪 DE</label>
    </div>

    <div class="header-brand">
        <p class="brand-1">ALOSERWIS</p>
        <p id="txt-brand-2" class="brand-2"></p>
        <p id="txt-brand-sub" class="brand-sub"></p>
        <p id="txt-brand-3" class="brand-3"></p>
    </div>

    <div class="section-title"><span id="txt-sec-1"></span></div>
    <input type="text" id="cust_name">
    <input type="text" id="cust_phone">
    <input type="text" id="cust_address">
    
    <div class="section-title"><span id="txt-sec-2"></span></div>
    <div id="questions-container"></div>

    <div class="section-title"><span id="txt-sec-3"></span></div>
    <div class="options-row" style="grid-template-columns: repeat(4, 1fr);">
        <label class="opt-label"><input type="checkbox" name="extra" value="ALARM" onchange="handleExtraClick(this)">🔔 ALARM</label>
        <label class="opt-label"><input type="checkbox" name="extra" value="DOMOFON" onchange="handleExtraClick(this)">📞 DOMO</label>
        <label class="opt-label"><input type="checkbox" name="extra" value="SIEĆ" onchange="handleExtraClick(this)">🌐 SIEĆ</label>
        <label class="opt-label"><input type="checkbox" name="extra" value="ELEKTRYK" onchange="handleExtraClick(this)">⚡ ELEK</label>
    </div>

    <div id="appointment-sec">
        <div style="font-size:0.75rem; font-weight:bold; color: #2980b9;" id="txt-app-title"></div>
        <div class="appoint-grid">
            <input type="date" id="app_date">
            <select id="app_time">
                <option value="09:00">09:00</option><option value="11:00">11:00</option>
                <option value="13:00">13:00</option><option value="15:00">15:00</option>
                <option value="17:00">17:00</option>
            </select>
        </div>
        <select id="app_loc" style="margin-top:8px;">
            <option value="Bakalarska 2 / B214">Bakalarska 2 / B214 (Warszawa)</option>
            <option value="Nadrzeczna 7C/A3">Nadrzeczna 7C/A3 (Wólka Kos.)</option>
        </select>
    </div>

    <div class="section-title"><span id="txt-sec-4"></span></div>
    <textarea id="final_note" rows="2"></textarea>

    <div class="hint-send" id="txt-hint-send"></div>

    <div class="social-row">
        <button onclick="askConfirm('mail')" class="social-circle" style="background:var(--accent); color:white">✉️</button>
        <button onclick="askConfirm('wa')" class="social-circle" style="background:var(--wa)"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"></button>
        <button onclick="askConfirm('viber')" class="social-circle" style="background:var(--viber)"><img src="https://cdn.worldvectorlogo.com/logos/viber-3.svg"></button>
        <button onclick="askConfirm('zalo')" class="social-circle" style="background:var(--zalo)"><img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg"></button>
        <button onclick="askConfirm('sms')" class="social-circle" style="background:var(--sms)">💬</button>
    </div>

    <div class="footer-info">
        <div class="footer-grid">
            <div class="f-location">
                <div class="f-label">OBIEKT 1</div>
                <div class="f-detail">Bakalarska 2 / B214<br>02-212 Warszawa<br><b>733 67 68 69</b></div>
            </div>
            <div class="f-location">
                <div class="f-label">OBIEKT 2</div>
                <div class="f-detail">Nadrzeczna 7C/A3<br>05-552 Wólka Kos.<br><b>787 456 999</b></div>
            </div>
            <div class="f-contact">
                <span><b>Website:</b> aloserwis.com</span>
                <span><b>Facebook:</b> fb.com/aloserwis</span>
                <span><b>Email:</b> alo@aloserwis.com</span>
            </div>
        </div>
        <div class="footer-bottom">&copy; 2026 ALOSERWIS</div>
    </div>
</div>

<script>
    const TARGET_EMAIL = "alo@aloserwis.com";
    const TARGET_PHONE = "48733676869";
    const translations = {
        PL: { 
            desc: "MONTAŻ I SERWIS MONITORINGU", brand: "Wycena systemów CCTV i innych", note: "(im więcej informacji, tym lepiej)", 
            sec1: "I. DANE KLIENTA", sec2: "II. SZCZEGÓŁY SYSTEMU", sec3: "III. INNE SYSTEMY?", sec4: "IV. UWAGI", 
            name: "Imię i Nazwisko", phone: "Numer telefonu", addr: "Adres montażu", other: "Inne...", 
            err: "Wypełnij Imię, Tel i Adres!", errQs: "Wybierz min. 5 opcji!", hint: "(Wybierz formę báo giá)", 
            mRetry: "Wyczyść", mOk: "Zamknij", confirmAsk: "Wysłać qua", confirmUse: "Bạn dùng", yes: "Tak", no: "Nie",
            appTitle: "📅 Umów spotkanie w biurze:", appMsg: "Quý khách có muốn đặt lịch Tư vấn tại cửa hàng chúng tôi không?",
            qs: [{q:"1. Typ obiektu?", a:["Dom","Biuro","Magazyn"]},{q:"2. Liczba kamer?", a:["1-4","5-10","> 10"]},{q:"3. Lokalizacja?", a:["Wewnątrz","Zewnątrz","Obie"]},{q:"4. Stan?", a:["Nowy","Istniejący","Remont"]},{q:"5. Połączenie?", a:["Kabel IP","Wi-Fi","Analog"]},{q:"6. Sprzęt?", a:["Z montażem","Własny","Porada"]},{q:"7. Funkcje?", a:["Noc-Kolor","Alarm","Audio"]},{q:"8. Dysk?", a:["1 Tydz","1 Mies","Cloud"]},{q:"9. Budżet?", a:["Ekonomiczny","Standard","Premium"]},{q:"10. Termin?", a:["Pilne","Miesiąc","Wycena"]}] 
        },
        VN: { 
            desc: "LẮP ĐẶT & BẢO TRÌ CAMERA", brand: "Báo giá hệ thống Camera và các hệ thống khác", note: "(Càng nhiều thông tin báo giá càng chính xác)", 
            sec1: "I. THÔNG TIN KHÁCH HÀNG", sec2: "II. CHI TIẾT HỆ THỐNG", sec3: "III. HỆ THỐNG KHÁC?", sec4: "IV. GHI CHÚ", 
            name: "Họ và Tên", phone: "Số điện thoại", addr: "Địa chỉ lắp đặt", other: "Khác...", 
            err: "Vui lòng nhập Tên, SĐT và Địa chỉ!", errQs: "Trả lời ít nhất 5 câu hỏi!", hint: "(Lựa chọn hình thức nhận Báo giá)", 
            mRetry: "Làm lại", mOk: "Đóng", confirmAsk: "Gửi qua", confirmUse: "Bạn dùng", yes: "Có", no: "Không",
            appTitle: "📅 Đặt lịch tư vấn tại cửa hàng:", appMsg: "Quý khách có muốn đặt lịch Tư vấn tại cửa hàng chúng tôi không?",
            qs: [{q:"1. Công trình?", a:["Nhà riêng","Văn phòng","Kho"]},{q:"2. Số lượng?", a:["1-4 mắt","5-10 mắt",">10 mắt"]},{q:"3. Vị trí?", a:["Trong nhà","Ngoài trời","Cả hai"]},{q:"4. Hạ tầng?", a:["Mới","Đã ở","Thay cũ"]},{q:"5. Kết nối?", a:["Dây IP","Wifi","Analog"]},{q:"6. Thiết bị?", a:["Trọn gói","Có sẵn","Cần tư vấn"]},{q:"7. Tính năng?", a:["Màu đêm","Báo động","Đàm thoại"]},{q:"8. Lưu trữ?", a:["1 Tuần","1 Tháng","Cloud"]},{q:"9. Ngân sách?", a:["Tiết kiệm","Vừa phải","Cao cấp"]},{q:"10. Tiến độ?", a:["Gấp","Bình thường","Khảo giá"]}] 
        },
        EN: { 
            desc: "CCTV INSTALLATION & SERVICE", brand: "CCTV & Security Systems Quote", note: "(More info = Better quote)", 
            sec1: "I. CUSTOMER DETAILS", sec2: "II. SYSTEM DETAILS", sec3: "III. OTHER SYSTEMS?", sec4: "IV. NOTES", 
            name: "Full Name", phone: "Phone Number", addr: "Address", other: "Other...", 
            err: "Fill Name, Phone and Address!", errQs: "Answer min. 5 questions!", hint: "(Choose how to send)", 
            mRetry: "Reset", mOk: "Close", confirmAsk: "Send via", confirmUse: "Use", yes: "Yes", no: "No",
            appTitle: "📅 Office Appointment:", appMsg: "Would you like to book an appointment at our store?",
            qs: [{q:"1. Building?", a:["House","Office","Warehouse"]},{q:"2. Cameras?", a:["1-4","5-10","> 10"]},{q:"3. Location?", a:["Indoor","Outdoor","Both"]},{q:"4. Status?", a:["New","Existing","Renovation"]},{q:"5. Connection?", a:["IP Cable","Wi-Fi","Analog"]},{q:"6. Equipment?", a:["Package","Own","Advice"]},{q:"7. Features?", a:["Night Color","Alarm","Audio"]},{q:"8. Storage?", a:["1 Week","1 Month","Cloud"]},{q:"9. Budget?", a:["Economy","Standard","Premium"]},{q:"10. Timeline?", a:["Urgent","Month","Pricing"]}] 
        }
    };
    ["TR","CN","UK","DE"].forEach(l => { translations[l] = translations.EN; });
    let curLang = 'PL';
    let appAsked = false;

    function openModal(msg, mode = 'alert', type = '') {
        const textEl = document.getElementById('modal-text'); const btnGroup = document.getElementById('modal-btns'); textEl.innerText = msg;
        if (mode === 'confirm') {
            const apps = { mail:'Email', wa:'WhatsApp', viber:'Viber', zalo:'Zalo', sms:'SMS' };
            const prefix = (type === 'mail' || type === 'sms') ? translations[curLang].confirmAsk : translations[curLang].confirmUse;
            textEl.innerText = `${prefix} ${apps[type]}?`;
            btnGroup.innerHTML = `<button class="m-btn btn-confirm" onclick="executeSend('${type}')">${translations[curLang].yes}</button><button class="m-btn btn-close" onclick="closeModal()">${translations[curLang].no}</button>`;
        } else if (mode === 'askApp') {
            btnGroup.innerHTML = `<button class="m-btn btn-confirm" onclick="showAppSec()">${translations[curLang].yes}</button><button class="m-btn btn-close" onclick="closeModal()">${translations[curLang].no}</button>`;
        } else {
            btnGroup.innerHTML = `<button class="m-btn btn-retry" onclick="resetAnswers()">${translations[curLang].mRetry}</button><button class="m-btn btn-close" onclick="closeModal()">${translations[curLang].mOk}</button>`;
        }
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function handleExtraClick(el) {
        el.parentElement.classList.toggle('selected', el.checked);
        if (!el.checked) return;
        const name = document.getElementById('cust_name').value;
        const phone = document.getElementById('cust_phone').value;
        const addr = document.getElementById('cust_address').value;
        if (!name || !phone || !addr) { el.checked = false; el.parentElement.classList.remove('selected'); openModal(translations[curLang].err); return; }
        let answered = 0;
        translations[curLang].qs.forEach((_, i) => { if(document.querySelector(`input[name="q${i}"]:checked`) || document.getElementById(`q${i}_man`).value.trim()) answered++; });
        if (answered < 5) { el.checked = false; el.parentElement.classList.remove('selected'); openModal(translations[curLang].errQs); return; }
        if (!appAsked) { openModal(translations[curLang].appMsg, 'askApp'); appAsked = true; }
    }

    function showAppSec() { document.getElementById('appointment-sec').style.display = 'block'; closeModal(); }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function resetAnswers() {
        document.querySelectorAll('input[type="radio"]:not([name="L"])').forEach(r => { r.checked = false; r.dataset.wasChecked = "false"; r.parentElement.classList.remove('selected'); });
        document.querySelectorAll('input[name="extra"]').forEach(c => { c.checked = false; c.parentElement.classList.remove('selected'); });
        document.querySelectorAll('.manual-input, #final_note, #app_date').forEach(i => i.value = ''); 
        document.getElementById('appointment-sec').style.display = 'none'; appAsked = false; closeModal();
    }

    function toggleExtra(s) { document.getElementById('sub-lang-container').style.display = s ? 'grid' : 'none'; }

    function setLang(l) {
        curLang = l; const cur = translations[l];
        document.getElementById('txt-brand-2').innerText = cur.desc; document.getElementById('txt-brand-sub').innerText = cur.brand; document.getElementById('txt-brand-3').innerText = cur.note;
        document.getElementById('txt-sec-1').innerText = cur.sec1; document.getElementById('txt-sec-2').innerText = cur.sec2; document.getElementById('txt-sec-3').innerText = cur.sec3; document.getElementById('txt-sec-4').innerText = cur.sec4;
        document.getElementById('txt-hint-send').innerText = cur.hint; document.getElementById('cust_name').placeholder = cur.name; document.getElementById('cust_phone').placeholder = cur.phone; document.getElementById('cust_address').placeholder = cur.addr;
        document.getElementById('txt-app-title').innerText = cur.appTitle;
        const c = document.getElementById('questions-container'); c.innerHTML = '';
        cur.qs.forEach((item, i) => {
            const row = document.createElement('div'); row.className = 'question-block';
            row.innerHTML = `<span class="question-text">${item.q}</span><div class="options-row">${item.a.map(opt => `<label class="opt-label"><input type="radio" name="q${i}" value="${opt}" onclick="handleRadioClick(this)"> ${opt}</label>`).join('')}</div><input type="text" class="manual-input" id="q${i}_man" placeholder="${cur.other}">`;
            c.appendChild(row);
        });
    }

    function handleRadioClick(el) {
        const isSelected = el.dataset.wasChecked === "true";
        document.querySelectorAll(`input[name="${el.name}"]`).forEach(r => { r.checked = false; r.dataset.wasChecked = "false"; r.parentElement.classList.remove('selected'); });
        if (!isSelected) { el.checked = true; el.dataset.wasChecked = "true"; el.parentElement.classList.add('selected'); }
    }

    function buildContent() {
        const name = document.getElementById('cust_name').value; const phone = document.getElementById('cust_phone').value; const addr = document.getElementById('cust_address').value;
        if (!name || !phone || !addr) { openModal(translations[curLang].err); return null; }
        let text = `ALOSERWIS - QUOTE\nName: ${name}\nTel: ${phone}\nAddr: ${addr}\n\n`; let answered = 0;
        translations[curLang].qs.forEach((item, i) => {
            const sel = document.querySelector(`input[name="q${i}"]:checked`); const man = document.getElementById(`q${i}_man`).value.trim();
            if(sel || man) { text += `${item.q} ${sel?sel.value:''} ${man?'('+man+')':''}\n`; answered++; }
        });
        if (answered < 5) { openModal(translations[curLang].errQs); return null; }
        const extras = Array.from(document.querySelectorAll('input[name="extra"]:checked')).map(el => el.value);
        if(extras.length > 0) {
            text += `\nExtras: ${extras.join(', ')}\n`;
            if (document.getElementById('appointment-sec').style.display === 'block') {
                const d = document.getElementById('app_date').value; const t = document.getElementById('app_time').value; const l = document.getElementById('app_loc').value;
                if(d) text += `LỊCH HẸN: ${d} lúc ${t} tại ${l}\n`;
            }
        }
        const note = document.getElementById('final_note').value.trim(); if(note) text += `\nNote: ${note}`;
        return { name, text };
    }

    function askConfirm(type) { if(buildContent()) openModal('', 'confirm', type); }

    function executeSend(t) {
        const d = buildContent(); if(!d) return; 
        const enc = encodeURIComponent(d.text); 
        closeModal();
        
        switch(t) {
            case 'mail': window.location.href = `mailto:${TARGET_EMAIL}?subject=Quote Request - ${d.name}&body=${enc}`; break;
            case 'wa': window.open(`https://wa.me/${TARGET_PHONE}?text=${enc}`, '_blank'); break;
            case 'viber': window.open(`viber://chat?number=%2B${TARGET_PHONE}&draft=${enc}`, '_blank'); break;
            case 'zalo': window.open(`https://zalo.me/${TARGET_PHONE}`, '_blank'); break;
            case 'sms': 
                const smsLink = (navigator.userAgent.match(/iPhone|iPad|iPod/i)) 
                                ? `sms:+${TARGET_PHONE}&body=${enc}` 
                                : `sms:+${TARGET_PHONE}?body=${enc}`;
                window.location.href = smsLink;
                break;
        }
    }
    setLang('PL');
</script>
</body>
</html>
