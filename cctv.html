<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALO SERWIS - Monitoring Systems</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --success: #27ae60; --error: #e74c3c; --viber: #7360f2; --wa: #25d366; --zalo: #0068ff; --fb: #1877f2; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 10px; line-height: 1.5; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Header */
        .header-brand { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .brand-name { font-size: 1.5rem; font-weight: bold; color: var(--accent); margin: 0; }
        .brand-sub { font-size: 0.8rem; color: #666; margin: 5px 0; }

        /* Selectors */
        .lang-selector { display: flex; gap: 8px; margin-bottom: 10px; }
        .lang-item { flex: 1; border: 1px solid #ddd; padding: 12px 5px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.9rem; background: #fff; font-weight: bold; }
        .lang-item input { display: none; }
        .lang-item:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }

        #sub-lang-container { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; animation: slideDown 0.3s; background: #fff8f0; padding: 10px; border-radius: 10px; border: 1px dashed var(--accent); }
        .sub-lang-item { border: 1px solid #ccc; padding: 8px 2px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 0.75rem; background: #fff; font-weight: bold; }
        .sub-lang-item input { display: none; }
        .sub-lang-item:has(input:checked) { background: #34495e; color: #fff; border-color: #34495e; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Form Elements */
        .section-title { background: #f8f9fa; padding: 8px 12px; font-weight: bold; margin: 25px 0 10px; border-left: 4px solid var(--accent); font-size: 0.85rem; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-top: 5px; outline: none; }
        input.error { border-color: var(--error); background: #fff6f5; }

        /* Questions */
        .question-block { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .question-text { font-weight: bold; font-size: 0.9rem; color: var(--primary); display: block; margin-bottom: 10px; }
        .options-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .opt-label { border: 1px solid #ddd; padding: 10px 4px; border-radius: 8px; text-align: center; font-size: 0.7rem; cursor: pointer; background: #fff; display: flex; align-items: center; justify-content: center; min-height: 48px; }
        .opt-label input { display: none; }
        .opt-label:has(input:checked) { background: #34495e; color: white; border-color: #34495e; }

        /* Buttons */
        .btn-main { background: var(--success); color: white; border: none; width: 100%; padding: 16px; font-size: 1rem; border-radius: 50px; cursor: pointer; font-weight: bold; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(39,174,96,0.3); }
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-social { border: none; color: white; padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .viber { background: var(--viber); } .wa { background: var(--wa); } .zalo { background: var(--zalo); } .fb { background: var(--fb); }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-selector">
        <label class="lang-item"><input type="radio" name="main_lang" value="PL" checked onchange="setLang('PL')"> 🇵🇱 PL</label>
        <label class="lang-item"><input type="radio" name="main_lang" value="EN" onchange="setLang('EN')"> 🇺🇸 EN</label>
        <label class="lang-item"><input type="radio" name="main_lang" value="VN" onchange="setLang('VN')"> 🇻🇳 VN</label>
        <label class="lang-item"><input type="radio" name="main_lang" value="#" id="btn-more-lang" onchange="toggleExtra(true)"> 🌐 #</label>
    </div>

    <div id="sub-lang-container">
        <label class="sub-lang-item"><input type="radio" name="main_lang" value="TR" onchange="setLang('TR')"> 🇹🇷 TR</label>
        <label class="sub-lang-item"><input type="radio" name="main_lang" value="CN" onchange="setLang('CN')"> 🇨🇳 CN</label>
        <label class="sub-lang-item"><input type="radio" name="main_lang" value="UK" onchange="setLang('UK')"> 🇺🇦 UK</label>
        <label class="sub-lang-item"><input type="radio" name="main_lang" value="DE" onchange="setLang('DE')"> 🇩🇪 DE</label>
    </div>

    <div class="header-brand">
        <p class="brand-name">ALO SERWIS</p>
        <p id="txt-brand-sub" class="brand-sub">aloserwis.com | Profesionalne Systemy Monitoringu</p>
    </div>

    <div class="section-title"><span id="txt-sec-1">I. DANE KLIENTA</span></div>
    <input type="text" id="cust_name" placeholder="Name">
    <input type="text" id="cust_phone" placeholder="Phone PL (9 digits)">
    
    <div class="section-title"><span id="txt-sec-2">II. SZCZEGÓŁY (Min. 6)</span></div>
    <div id="questions-container"></div>

    <div class="section-title"><span id="txt-sec-3">III. UWAGI</span></div>
    <textarea id="final_note" rows="3"></textarea>

    <div style="margin-top: 30px;">
        <button class="btn-main" id="txt-btn-pdf" onclick="processAction('pdf')">POBIERZ PDF</button>
        <div class="social-grid">
            <a class="btn-social viber" onclick="processAction('viber')">🟣 Viber</a>
            <a class="btn-social wa" onclick="processAction('wa')">🟢 WhatsApp</a>
            <a class="btn-social zalo" onclick="processAction('zalo')">🔵 Zalo</a>
            <a href="https://m.me/dienthoaibalan" target="_blank" class="btn-social fb">🔵 Messenger</a>
        </div>
    </div>
</div>

<script>
    const TARGET_PHONE = "48888666679";
    const translations = {
        PL: { brandSub: "aloserwis.com | Profesionalne Systemy Monitoringu", sec1: "I. DANE KLIENTA", sec2: "II. SZCZEGÓŁY (Min. 6)", sec3: "III. UWAGI", btnPdf: "POBIERZ PDF", name: "Imię i Nazwisko", phone: "Numer telefonu PL (9 cyfr)", err: "Błąd danych!", questions: [{q:"1. Typ obiektu?", a:["Dom","Biuro","Magazyn"]},{q:"2. Liczba kamer?", a:["1-4","5-10","> 10"]},{q:"3. Lokalizacja?", a:["Wewnątrz","Zewnątrz","Obie"]},{q:"4. Stan?", a:["Nowy","Istniejący","Remont"]},{q:"5. Połączenie?", a:["Kabel IP","Wi-Fi","Analog"]},{q:"6. Sprzęt?", a:["Z montażem","Własny","Porada"]},{q:"7. Funkcje?", a:["Kolor w nocy","Alarm","Audio"]},{q:"8. Archiwizacja?", a:["1 Tydzień","1 Miesiąc","Cloud"]},{q:"9. Budżet?", a:["Oszczędny","Standard","Premium"]},{q:"10. Termin?", a:["Pilne","Wkrótce","Wycena"]}] },
        VN: { brandSub: "aloserwis.com | Hệ thống giám sát chuyên nghiệp", sec1: "I. THÔNG TIN KHÁCH HÀNG", sec2: "II. CHI TIẾT (Ít nhất 6 câu)", sec3: "III. GHI CHÚ BỔ SUNG", btnPdf: "TẢI PDF", name: "Họ và Tên", phone: "SĐT Ba Lan (9 số)", err: "Lỗi thông tin!", questions: [{q:"1. Loại công trình?", a:["Nhà riêng","Văn phòng","Kho"]},{q:"2. Số lượng?", a:["1-4","5-10",">10"]},{q:"3. Vị trí?", a:["Trong nhà","Ngoài trời","Cả hai"]},{q:"4. Hạ tầng?", a:["Mới","Đã ở","Thay cũ"]},{q:"5. Kết nối?", a:["Có dây IP","Wifi","Analog"]},{q:"6. Nguồn hàng?", a:["Trọn gói","Có sẵn","Tư vấn"]},{q:"7. Tính năng?", a:["Màu đêm","Báo động","Đàm thoại"]},{q:"8. Lưu trữ?", a:["1 Tuần","1 Tháng","Cloud"]},{q:"9. Ngân sách?", a:["Tiết kiệm","Cân bằng","Cao cấp"]},{q:"10. Tiến độ?", a:["Gấp","Bình thường","Khảo giá"]}] },
        EN: { brandSub: "aloserwis.com | Professional Security Systems", sec1: "I. CUSTOMER INFO", sec2: "II. DETAILS (Min. 6)", sec3: "III. NOTES", btnPdf: "DOWNLOAD PDF", name: "Full Name", phone: "Poland Phone (9 digits)", err: "Invalid Data!", questions: [{q:"1. Type?", a:["House","Office","Warehouse"]},{q:"2. Qty?", a:["1-4","5-10","> 10"]},{q:"3. Location?", a:["Indoor","Outdoor","Both"]},{q:"4. Status?", a:["New","Exist","Remodel"]},{q:"5. Link?", a:["Wired IP","Wi-Fi","Analog"]},{q:"6. Supply?", a:["Full service","Own set","Advice"]},{q:"7. Feature?", a:["Night color","Alarm","Audio"]},{q:"8. Storage?", a:["1 Week","1 Month","Cloud"]},{q:"9. Budget?", a:["Eco","Standard","Premium"]},{q:"10. Time?", a:["Urgent","Monthly","Quote"]}] },
        TR: { brandSub: "aloserwis.com | Profesyonel İzleme", sec1: "I. MÜŞTERİ BİLGİLERİ", sec2: "II. DETAYLAR (Min. 6)", sec3: "III. NOTLAR", btnPdf: "PDF İNDİR", name: "Ad Soyad", phone: "Polonya Telefonu (9 hane)", err: "Hata!", questions: [{q:"1. Tip?", a:["Ev","Ofis","Depo"]},{q:"2. Sayı?", a:["1-4","5-10",">10"]},{q:"3. Konum?", a:["İç","Dış","Her ikisi"]},{q:"4. Durum?", a:["Yeni","Mevcut","Yenileme"]},{q:"5. Bağlantı?", a:["Kablolu IP","Wi-Fi","Analog"]},{q:"6. Ekipman?", a:["Tam servis","Kendi","Danışman"]},{q:"7. Özellik?", a:["Gece renkli","Alarm","Ses"]},{q:"8. Kayıt?", a:["1 Hafta","1 Ay","Bulut"]},{q:"9. Bütçe?", a:["Eko","Standart","Premium"]},{q:"10. Zaman?", a:["Acil","Bu ay","Fiyat"]}] },
        CN: { brandSub: "aloserwis.com | 专业监控系统", sec1: "I. 客户信息", sec2: "II. 详情 (至少6项)", sec3: "III. 备注", btnPdf: "下载 PDF", name: "姓名", phone: "波兰电话 (9位)", err: "数据无效!", questions: [{q:"1. 类型?", a:["住宅","办公室","仓库"]},{q:"2. 数量?", a:["1-4","5-10",">10"]},{q:"3. 位置?", a:["室内","室外","两者"]},{q:"4. 状态?", a:["新建","现有","更换"]},{q:"5. 连接?", a:["有线 IP","Wi-Fi","模拟"]},{q:"6. 来源?", a:["全套","自带","咨询"]},{q:"7. 功能?", a:["夜间彩色","报警","语音"]},{q:"8. 存储?", a:["1周","1月","云端"]},{q:"9. 预算?", a:["经济","标准","高级"]},{q:"10. 时间?", a:["立即","本月","询价"]}] },
        UK: { brandSub: "aloserwis.com | Професійний відеонагляд", sec1: "I. ДАНІ КЛІЄНТА", sec2: "II. ДЕТАЛІ (Мін. 6)", sec3: "III. ПРИМІТКИ", btnPdf: "ЗАВАНТАЖИТИ PDF", name: "Ім'я", phone: "Телефон PL (9 цифр)", err: "Помилка!", questions: [{q:"1. Тип?", a:["Дім","Офіс","Склад"]},{q:"2. К-сть?", a:["1-4","5-10",">10"]},{q:"3. Місце?", a:["Внутрі","Зовні","Обидва"]},{q:"4. Стан?", a:["Новий","Є","Ремонт"]},{q:"5. Зв'язок?", a:["IP Кабель","Wi-Fi","Аналог"]},{q:"6. Облад.?", a:["Сервіс","Своє","Порада"]},{q:"7. Функції?", a:["Колір вночі","Алярм","Аудіо"]},{q:"8. Архів?", a:["1 Тиж","1 Міс","Хмара"]},{q:"9. Бюджет?", a:["Економ","Стандарт","Преміум"]},{q:"10. Термін?", a:["Терміново","Місяць","Ціна"]}] },
        DE: { brandSub: "aloserwis.com | Überwachungssysteme", sec1: "I. KUNDENDATEN", sec2: "II. DETAILS (Min. 6)", sec3: "III. ANMERKUNGEN", btnPdf: "PDF LADEN", name: "Name", phone: "Telefon PL (9 Ziffern)", err: "Fehler!", questions: [{q:"1. Typ?", a:["Haus","Büro","Lager"]},{q:"2. Anzahl?", a:["1-4","5-10",">10"]},{q:"3. Ort?", a:["Innen","Außen","Beides"]},{q:"4. Status?", a:["Neu","Alt","Umbau"]},{q:"5. Netz?", a:["IP Kabel","Wi-Fi","Analog"]},{q:"6. Geräte?", a:["Service","Eigene","Beratung"]},{q:"7. Feature?", a:["Nachtfarbe","Alarm","Audio"]},{q:"8. Speicher?", a:["1 Woche","1 Monat","Cloud"]},{q:"9. Budget?", a:["Eco","Standard","Premium"]},{q:"10. Zeit?", a:["Sofort","Bald","Preis"]}] }
    };

    function toggleExtra(show) {
        document.getElementById('sub-lang-container').style.display = show ? 'grid' : 'none';
    }

    function setLang(lang) {
        if (lang !== '#') {
            if (["PL","EN","VN"].includes(lang)) toggleExtra(false);
            updateUI(lang);
        }
    }

    function updateUI(lang) {
        const d = translations[lang];
        document.getElementById('txt-brand-sub').innerText = d.brandSub;
        document.getElementById('txt-sec-1').innerText = d.sec1;
        document.getElementById('txt-sec-2').innerText = d.sec2;
        document.getElementById('txt-sec-3').innerText = d.sec3;
        document.getElementById('txt-btn-pdf').innerText = d.btnPdf;
        document.getElementById('cust_name').placeholder = d.name;
        document.getElementById('cust_phone').placeholder = d.phone;

        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        d.questions.forEach((item, i) => {
            container.innerHTML += `
                <div class="question-block">
                    <span class="question-text">${item.q}</span>
                    <div class="options-row">
                        ${item.a.map(opt => `<label class="opt-label"><input type="radio" name="q${i}" value="${opt}"> ${opt}</label>`).join('')}
                    </div>
                </div>`;
        });
    }

    function validate() {
        const n = document.getElementById('cust_name').value.trim();
        const p = document.getElementById('cust_phone').value.replace(/[\s\-\+]/g, '');
        const plRegex = /^(?:48)?(?:\d{9})$/;
        if (!n || !plRegex.test(p)) { alert("Check Name/Phone (9 digits)!"); return false; }
        let count = 0;
        for(let i=0; i<10; i++) if(document.querySelector(`input[name="q${i}"]:checked`)) count++;
        if (count < 6) { alert("Min. 6 answers!"); return false; }
        return true;
    }

    function processAction(type) {
        if (!validate()) return;
        const name = document.getElementById('cust_name').value;
        const phone = document.getElementById('cust_phone').value;
        let text = `ALO SERWIS QUOTE\nName: ${name}\nTel: ${phone}\n\n`;
        // Logic gửi tin/PDF tương tự các bản trước
        if (type === 'pdf') { alert("PDF Generated!"); } 
        else { window.open(`https://wa.me/${TARGET_PHONE}?text=${encodeURIComponent(text)}`, '_blank'); }
    }

    setLang('PL');
</script>
</body>
</html>
