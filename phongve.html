<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phòng Vé ALO-SERWIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@300;400;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; 
            overflow-x: hidden; 
            overflow-y: auto; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; 
            overscroll-behavior-y: contain;
        }

        #bg-container { position: fixed; inset: 0; z-index: 1; width: 100vw; height: 100vh; pointer-events: none; }
        .bg-slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.1); transition: opacity 2s ease-in-out, transform 12s linear; }
        .bg-slide.active { opacity: 1; transform: scale(1); }
        .overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: rgba(0, 0, 0, 0.6); opacity: 0; transition: opacity 1.5s ease; }
        
        #master-container { position: relative; z-index: 10; transform-origin: center; flex-shrink: 0; font-family: 'Roboto', sans-serif; color: white; pointer-events: none; }

        /* --- DESKTOP STYLE --- */
        .desktop-content { width: 1920px; height: 1080px; display: flex; align-items: center; padding: 0 100px; }
        .widget-group-ds { position: absolute; top: 105px; display: flex; flex-direction: column; gap: 15px; }
        .weather-card-ds { width: 190px; padding: 25px 15px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        .time-circle-ds { width: 195px; height: 195px; background: rgba(255,255,255,0.07); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .headline-ds { font-family: 'Oswald', sans-serif; font-size: 130px; line-height: 1; text-transform: uppercase; font-weight: 700; }
        .contact-glow { filter: drop-shadow(0 0 15px var(--glow-color)); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }

        /* --- MOBILE STYLE --- */
        .mobile-content { width: 1080px; height: 1920px; display: flex; flex-direction: column; align-items: center; padding: 30px 50px 40px 50px; text-align: center; justify-content: flex-start; }
        .widget-row-mb { display: flex; gap: 20px; margin-bottom: 50px; justify-content: center; width: 100%; }
        .weather-box-mb { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 40px; min-width: 320px; }
        
        .route-mb { font-family: 'Oswald', sans-serif; text-transform: uppercase; margin: 25px 0; width: 100%; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        .auto-size-text { white-space: nowrap; width: 100%; display: block; line-height: 1; }
        
        .price-mb { font-size: 150px; font-weight: 900; line-height: 1; }

        /* --- CHUNG & UTILS --- */
        .brand-text-only { font-family: 'Oswald', sans-serif; color: white; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .price-box { display: inline-block; padding: 30px 60px; color: black; box-shadow: 0 15px 45px rgba(0,0,0,0.4); }
        .label-tiny { font-size: 14px; opacity: 0.7; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; }
        
        /* FLOATING UI MOBILE - Đã dịch xuống 30px (bottom 35px -> 5px) */
        #mobile-ui { display: none; position: fixed; bottom: 5px; left: 15px; flex-direction: column; gap: 15px; z-index: 9999; pointer-events: none; }
        .float-btn-wrapper { display: flex; align-items: center; pointer-events: auto; text-decoration: none !important; }
        .float-btn { width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; position: relative; z-index: 2; }
        .float-label { padding: 8px 20px 8px 40px; margin-left: -30px; border-radius: 0 30px 30px 0; font-weight: 900; font-size: 16px; color: white; text-transform: uppercase; z-index: 1; }
        
        .shake { animation: iconShake 3s infinite ease-in-out; }
        @keyframes iconShake { 0%, 70%, 100% { transform: scale(1) rotate(0); } 75% { transform: scale(1.1) rotate(-15deg); } 80% { transform: scale(1.1) rotate(15deg); } 95% { transform: scale(1.1) rotate(0); } }

        .content-wrapper { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .content-wrapper.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 1024px) { #mobile-ui { display: flex; } }
    </style>
</head>
<body onclick="handleGlobalClick(event)">
    <div id="bg-container"></div>
    <div id="dynamic-overlay" class="overlay"></div>
    <div id="master-container"><div id="app"></div></div>

    <div id="mobile-ui">
        <a href="#" id="ms-link-mob" target="_blank" class="float-btn-wrapper">
            <div class="float-btn shake" style="background-color: #0084FF; color: white;"><i class="fa-brands fa-facebook-messenger"></i></div>
            <div class="float-label" style="background-color: #0084FF;">Nhắn tin</div>
        </a>
        <a href="#" id="call-link-mob" class="float-btn-wrapper">
            <div id="call-icon-mob" class="float-btn shake" style="animation-delay: 1.5s;"><i class="fa-solid fa-phone"></i></div>
            <div id="call-label-mob" class="float-label"></div>
        </a>
    </div>

    <script>
        const MESSENGER_ID = 'tony.pleu'; 
        const SHEET_ID = '1o1mouw1JJcLLs8vIW5M37YRbsjqSU6sEso6dF1OVChI';
        let flights = [], currentIndex = 0, currentZones = [], slideTimer;
        let lastKnown = { phone: '0696 143 992', accent: '#FFDE59', msg: 'Tôi quan tâm vé' };

        // Pull to refresh
        let touchStart = 0;
        window.addEventListener('touchstart', e => { touchStart = e.touches[0].pageY; }, {passive: true});
        window.addEventListener('touchend', e => {
            const touchEnd = e.changedTouches[0].pageY;
            if (window.scrollY === 0 && touchEnd - touchStart > 180) { location.reload(); }
        }, {passive: true});

        function getDynamicFontSize(text, baseSize) {
            const length = text.length;
            if (length <= 8) return baseSize + "px";
            if (length <= 12) return (baseSize * 0.8) + "px";
            if (length <= 16) return (baseSize * 0.7) + "px";
            return (baseSize * 0.6) + "px";
        }

        function handleResize() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const targetW = isPortrait ? 1080 : 1920;
            const targetH = isPortrait ? 1920 : 1080;
            const scale = Math.min(window.innerWidth / targetW, window.innerHeight / targetH);
            document.getElementById('master-container').style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', handleResize); handleResize();

        function updateData() { 
            const script = document.createElement('script'); 
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:loadData&t=${Date.now()}`; 
            document.body.appendChild(script); 
        }

        window.loadData = (data) => {
            flights = data.table.rows.map(r => r.c.map(c => c ? (c.f || c.v) : "")).filter(row => row[8]);
            document.getElementById('bg-container').innerHTML = flights.map((f, i) => `<img src="${f[8]}" class="bg-slide" id="slide-${i}">`).join('');
            runSequence();
        };

        function getWeatherIcon(code) {
            if (code <= 1) return 'fa-sun'; if (code <= 3) return 'fa-cloud-sun'; if (code <= 48) return 'fa-smog';
            if (code <= 55) return 'fa-cloud-rain'; if (code <= 67) return 'fa-cloud-showers-heavy';
            if (code <= 77) return 'fa-snowflake'; if (code <= 82) return 'fa-cloud-showers-water'; return 'fa-bolt-lightning';
        }

        async function fetchCity(city) {
            try {
                const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`).then(r => r.json());
                const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.results[0].latitude}&longitude=${geo.results[0].longitude}&current_weather=true`).then(r => r.json());
                return { temp: Math.round(w.current_weather.temperature), tz: geo.results[0].timezone, icon: getWeatherIcon(w.current_weather.weathercode) };
            } catch (e) { return { temp: "--", tz: "UTC", icon: "fa-cloud" }; }
        }

        function updateClocks() {
            document.querySelectorAll('.time-val').forEach((el, i) => {
                const tz = currentZones[i];
                if (tz) el.innerText = new Intl.DateTimeFormat('vi-VN', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
            });
        }
        setInterval(updateClocks, 1000);

        function handleGlobalClick(e) { if (!e.target.closest('a')) { clearTimeout(slideTimer); nextSlide(); } }
        function nextSlide() { currentIndex = (currentIndex + 1) % flights.length; runSequence(); }

        async function runSequence() {
            const f = flights[currentIndex];
            const hasInfo = f[0] && f[0].trim() !== "";
            const isPortrait = window.innerHeight > window.innerWidth;
            
            document.querySelectorAll('.bg-slide').forEach(s => s.classList.remove('active'));
            document.getElementById(`slide-${currentIndex}`).classList.add('active');

            if (hasInfo) {
                lastKnown.phone = f[9] || lastKnown.phone;
                lastKnown.accent = f[7]?.startsWith('#') ? f[7] : '#' + (f[7] || 'FFDE59');
                
                // Link Messenger
                document.getElementById('ms-link-mob').href = `https://m.me/${MESSENGER_ID}?text=${encodeURIComponent(`Tôi quan tâm vé hãng ${f[0]} đi ${f[2]}`)}`;
                // Link Call
                document.getElementById('call-link-mob').href = `tel:${lastKnown.phone.replace(/\s/g, '')}`;
            }

            const contrast = (lastKnown.accent.toLowerCase() === '#ffffff' || lastKnown.accent.toLowerCase() === '#ffde59') ? 'black' : 'white';
            document.getElementById('call-icon-mob').style.backgroundColor = lastKnown.accent;
            document.getElementById('call-icon-mob').style.color = contrast;
            document.getElementById('call-label-mob').style.backgroundColor = lastKnown.accent;
            document.getElementById('call-label-mob').style.color = contrast;
            document.getElementById('call-label-mob').innerText = lastKnown.phone;

            const app = document.getElementById('app');
            if (!hasInfo) {
                document.getElementById('dynamic-overlay').style.opacity = "0";
                app.innerHTML = "";
                slideTimer = setTimeout(nextSlide, (f[10] || 10) * 1000);
                return;
            }

            document.getElementById('dynamic-overlay').style.opacity = "1";
            const cities = String(f[3]).toLowerCase().includes("bay thẳng") ? [f[1], f[2]] : [f[1], f[3], f[2]];
            const weatherData = await Promise.all(cities.map(c => fetchCity(c)));
            currentZones = weatherData.map(w => w.tz);

            if (!isPortrait) {
                const isEven = currentIndex % 2 === 0;
                app.innerHTML = `
                    <div class="desktop-content content-wrapper" style="justify-content: ${isEven ? 'flex-start' : 'flex-end'}">
                        <div class="widget-group-ds" style="${isEven ? 'right: 100px;' : 'left: 100px;'}">
                            <div class="flex gap-4">${weatherData.map((w, i) => `<div class="weather-card-ds"><i class="fa-solid ${w.icon} text-4xl mb-2" style="color:${lastKnown.accent}"></i><p class="uppercase font-bold">${cities[i]}</p><p class="text-4xl font-black">${w.temp}°C</p></div>`).join('')}</div>
                            <div class="flex gap-4">${weatherData.map((w, i) => `<div class="time-circle-ds"><p class="time-val text-5xl font-black">--:--</p><p class="label-tiny">${cities[i]}</p></div>`).join('')}</div>
                        </div>
                        <div style="width: 1250px" class="${!isEven ? 'text-right' : 'text-left'}">
                            <div class="mb-4"><span class="brand-text-only text-4xl">PHÒNG VÉ ALO-SERWIS</span></div>
                            <div class="flex items-baseline gap-8 mb-6 ${!isEven ? 'justify-end' : ''}">
                                <span class="bg-white text-black px-8 py-3 font-black text-4xl uppercase rounded-xl">${f[0]}</span>
                                <span class="text-[45px] font-[900] italic uppercase" style="color:${lastKnown.accent}">${f[6] || ''}</span>
                            </div>
                            <div class="headline-ds mb-8">
                                <div class="opacity-80">${f[1]}</div>
                                <div class="flex items-baseline gap-6 ${!isEven ? 'justify-end' : ''}"><span style="color:${lastKnown.accent}" class="italic font-light text-7xl">ĐẾN</span><span>${f[2]}</span></div>
                            </div>
                            <div class="flex gap-20 mb-10 ${isEven ? 'border-l-[12px] pl-10' : 'border-r-[12px] pr-10 justify-end'}" style="border-color:${lastKnown.accent}">
                                <div><p class="label-tiny text-xl">Hành trình</p><b class="text-5xl uppercase">${f[3]}</b></div>
                                ${f[4] ? `<div><p class="label-tiny text-xl">Hành lý</p><b class="text-5xl" style="color:${lastKnown.accent}">${f[4]}</b></div>` : ''}
                            </div>
                            <div class="price-box mb-10" style="background:${lastKnown.accent}dd; transform: skewX(${isEven ? '-10deg' : '10deg'})">
                                <div style="transform: skewX(${isEven ? '10deg' : '-10deg'})"><p class="text-2xl font-bold uppercase italic">Giá vé trọn gói</p><p class="text-[110px] font-black leading-none">${f[5]}</p></div>
                            </div>
                            <div class="flex gap-12 ${!isEven ? 'flex-row-reverse' : ''}">
                                <div class="contact-glow" style="--glow-color:${lastKnown.accent}"><div class="flex items-center gap-4"><div class="w-20 h-20 rounded-full flex items-center justify-center" style="background:${lastKnown.accent}"><i class="fa-solid fa-phone text-black text-3xl"></i></div><span class="text-7xl font-black italic" style="color:${lastKnown.accent}">${lastKnown.phone}</span></div></div>
                                <div class="contact-glow" style="--glow-color:#0084FF"><div class="flex items-center gap-4"><div class="w-20 h-20 rounded-full flex items-center justify-center" style="background:#0084FF"><i class="fa-brands fa-facebook-messenger text-white text-3xl"></i></div><span class="text-7xl font-black italic" style="color:#0084FF">MESSENGER</span></div></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div class="mobile-content content-wrapper">
                        <div class="mb-4"><span class="brand-text-only text-[48px]">PHÒNG VÉ ALO-SERWIS</span></div>
                        <div class="widget-row-mb">
                            ${weatherData.map((w, i) => `
                                <div class="weather-box-mb">
                                    <div class="time-val text-7xl font-black">--:--</div>
                                    <div class="text-3xl font-bold uppercase mt-1">${cities[i]} <span style="color:${lastKnown.accent}">${w.temp}°C</span></div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="mb-8">
                            <div class="bg-white text-black px-10 py-3 font-black text-4xl uppercase rounded-xl inline-block">${f[0]}</div>
                            <div class="text-5xl font-black italic uppercase block mt-6" style="color:${lastKnown.accent}">${f[6] || ''}</div>
                        </div>
                        <div class="route-mb">
                            <div class="auto-size-text opacity-80" style="font-size: ${getDynamicFontSize(f[1], 120)}">${f[1]}</div>
                            <div class="text-6xl italic my-4" style="color:${lastKnown.accent}">ĐẾN</div>
                            <div class="auto-size-text font-black" style="font-size: ${getDynamicFontSize(f[2], 200)}">${f[2]}</div>
                        </div>
                        <div class="flex justify-center gap-12 py-7 border-y-2 border-white/10 w-full mb-10">
                            <div><p class="label-tiny text-2xl mb-1">Hành trình</p><b class="text-6xl uppercase">${f[3]}</b></div>
                            ${f[4] ? `<div><p class="label-tiny text-2xl mb-1">Hành lý</p><b class="text-6xl" style="color:${lastKnown.accent}">${f[4]}</b></div>` : ''}
                        </div>
                        <div class="price-box w-full py-12 rounded-[50px]" style="background:${lastKnown.accent}">
                            <p class="text-4xl font-bold italic uppercase mb-1">Giá vé trọn gói</p>
                            <p class="price-mb">${f[5]}</p>
                        </div>
                    </div>
                `;
            }

            setTimeout(() => document.querySelector('.content-wrapper')?.classList.add('show'), 100);
            updateClocks();
            slideTimer = setTimeout(nextSlide, (f[10] || 10) * 1000);
        }
        updateData();
    </script>
</body>
</html>
